<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家具库存管理</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #f5f5f5; --surface: #fff; --border: #e0e0e0; --text: #222; --text-secondary: #666; --primary: #1a73e8; --primary-hover: #1557b0; --danger: #d93025; --danger-hover: #b3261e; --warn: #e37400; --warn-bg: #fef7e0; --radius: 6px; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 10; }
header h1 { font-size: 16px; font-weight: 600; }
header .actions { display: flex; gap: 8px; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 24px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.stat-card .value { font-size: 22px; font-weight: 600; }
.stat-card.warn .value { color: var(--warn); }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar input, .toolbar select { height: 34px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 13px; background: var(--surface); }
.toolbar input { flex: 1; min-width: 160px; }
.toolbar select { min-width: 100px; }
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--primary); }
.btn { height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; background: var(--surface); color: var(--text); white-space: nowrap; }
.btn:hover { background: #f0f0f0; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: #fce8e6; }
.btn.small { height: 28px; padding: 0 8px; font-size: 12px; }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { font-weight: 600; font-size: 12px; color: var(--text-secondary); background: #fafafa; }
tr:last-child td { border-bottom: none; }
tr:hover { background: #fafafa; }
td.actions-cell { display: flex; gap: 4px; }
.low-stock { background: var(--warn-bg); }
.low-stock:hover { background: #fef3cd; }
.empty { text-align: center; padding: 48px 16px; color: var(--text-secondary); font-size: 14px; }
.thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); background: #fafafa; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: flex-start; justify-content: center; padding-top: 40px; overflow-y: auto; }
.modal-overlay.show { display: flex; }
.modal { background: var(--surface); border-radius: 8px; width: 500px; max-width: calc(100vw - 32px); box-shadow: 0 4px 24px rgba(0,0,0,0.15); margin-bottom: 40px; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 15px; font-weight: 600; }
.modal-header .close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-secondary); padding: 0 4px; }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 13px; }
.form-group textarea { height: 60px; padding: 8px 10px; resize: vertical; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.img-upload { display: flex; align-items: center; gap: 12px; }
.img-upload img { width: 64px; height: 64px; border-radius: 4px; object-fit: cover; border: 1px solid var(--border); background: #fafafa; }
.img-upload .placeholder { width: 64px; height: 64px; border-radius: 4px; border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 12px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: var(--radius); font-size: 13px; z-index: 200; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab { padding: 8px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-secondary); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
@media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } .form-row, .form-row3 { grid-template-columns: 1fr; } header { padding: 0 12px; } main { padding: 12px; } }
</style>
</head>
<body><header>
  <h1>家具库存管理</h1>
  <div class="actions">
    <button class="btn" onclick="exportData()">导出</button>
      <button class="btn" onclick="fetchRemoteData()" id="syncBtn" title="从云端加载最新数据">云端刷新</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn primary" onclick="openAddModal()">+ 添加商品</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索商品名称..." oninput="render()">
    <select id="categoryFilter" onchange="render()"><option value="">全部分类</option></select>
    <select id="supplierFilter" onchange="render()"><option value="">全部供应商</option></select>
    <button class="btn small" onclick="clearFilters()">清除</button>
    <button class="btn small" onclick="openSupplierManager()">管理供应商</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:48px">图片</th>
          <th>商品名称</th>
          <th>分类</th>
          <th>供应商</th>
          <th>库存</th>
          <th>进价</th>
          <th>售价</th>
          <th>库位</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none">暂无库存数据，点击「添加商品」开始录入</div>
  </div>
</main><!-- Item Modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">添加商品</h2>
      <button class="close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <div class="form-group">
        <label>商品图片</label>
        <div class="img-upload">
          <img id="itemImgPreview" src="" style="display:none">
          <div class="placeholder" id="itemImgPlaceholder">无图片</div>
          <div>
            <input type="file" id="itemImgFile" accept="image/*" onchange="previewItemImage()" style="display:none">
            <button class="btn small" onclick="document.getElementById('itemImgFile').click()">选择图片</button>
            <button class="btn small" onclick="removeItemImage()">清除</button>
          </div>
        </div>
        <input type="hidden" id="itemImgData">
      </div>
      <div class="form-group">
        <label>商品名称 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="itemName" placeholder="例如：实木双人床 1.8m">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>分类</label>
          <select id="itemCategory"><option value="">请选择</option></select>
        </div>
        <div class="form-group">
          <label>库存数量</label>
          <input type="number" id="itemQty" min="0" value="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>进货价 (元)</label>
          <input type="number" id="itemCost" min="0" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label>售价 (元)</label>
          <input type="number" id="itemPrice" min="0" step="0.01" value="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>供应商</label>
          <select id="itemSupplier"><option value="">请选择</option></select>
        </div>
        <div class="form-group">
          <label>库位</label>
          <input type="text" id="itemLocation" placeholder="例如：A区-3排">
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="itemNotes" placeholder="可选备注信息"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="saveItem()">保存</button>
    </div>
  </div>
</div><!-- Stock Modal -->
<div class="modal-overlay" id="stockModal">
  <div class="modal">
    <div class="modal-header">
      <h2>库存操作</h2>
      <button class="close" onclick="closeStockModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:14px;margin-bottom:10px"><strong id="stockItemName"></strong></p>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">当前库存: <strong id="stockCurrent">0</strong></p>
      <div class="form-group">
        <label>数量</label>
        <input type="number" id="stockQty" min="1" value="1" style="width:120px">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeStockModal()">取消</button>
      <button class="btn primary" onclick="doStockOp('in')">进货 +</button>
      <button class="btn danger" id="stockOutBtn" onclick="doStockOp('out')">出货 -</button>
    </div>
  </div>
</div>
<!-- Supplier Modal -->
<div class="modal-overlay" id="supplierModal">
  <div class="modal">
    <div class="modal-header">
      <h2>供应商管理</h2>
      <button class="close" onclick="closeSupplierModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row3" style="margin-bottom:12px">
        <input type="text" id="supName" placeholder="供应商名称">
        <input type="text" id="supContact" placeholder="联系人">
        <input type="text" id="supPhone" placeholder="联系电话">
      </div>
      <button class="btn primary small" onclick="addSupplier()" style="margin-bottom:12px">添加供应商</button>
      <div id="supplierList" style="max-height:300px;overflow-y:auto"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeSupplierModal()">关闭</button>
    </div>
  </div>
</div>

<!-- URL Config Modal -->
<div class="modal-overlay" id="urlModal">
  <div class="modal">
    <div class="modal-header">
      <h2>配置云端地址</h2>
      <button class="close" onclick="closeUrlModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">粘贴 GitHub 上 JSON 文件的链接，网页地址或 Raw 地址均可</p>
      <div class="form-group">
        <label>JSON 文件 URL</label>
        <input type="text" id="urlInput" placeholder="https://github.com/... 或 https://raw.githubusercontent.com/...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeUrlModal()">取消</button>
      <button class="btn primary" onclick="saveRemoteUrl()">保存并加载</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div><script>
// ==================== DATA LAYER ====================
var CATEGORIES = ['床类','沙发','餐桌椅','柜类','办公家具','其他'];
var ITEM_KEY = 'furniture_items';
var SUPPLIER_KEY = 'furniture_suppliers';
var IMG_DB = 'furniture_images';
var LOW_STOCK = 5;
var REMOTE_URL_KEY = 'furniture_remote_url';
var remoteUrl = '';
var items = [];
var suppliers = [];
var stockTargetId = null;
var imgDb = null;

// ---------- localStorage ----------
function loadItems() {
  try { items = JSON.parse(localStorage.getItem(ITEM_KEY)) || []; } catch(e) { items = []; }
}
function saveItems() { localStorage.setItem(ITEM_KEY, JSON.stringify(items)); }
function loadSuppliers() {
  try { suppliers = JSON.parse(localStorage.getItem(SUPPLIER_KEY)) || []; } catch(e) { suppliers = []; }
}
function saveSuppliers() { localStorage.setItem(SUPPLIER_KEY, JSON.stringify(suppliers)); }

// ---------- IndexedDB for images ----------
function openImgDb() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(IMG_DB, 1);
    req.onupgradeneeded = function(e) { e.target.result.createObjectStore('images'); };
    req.onsuccess = function(e) { imgDb = e.target.result; resolve(); };
    req.onerror = function(e) { reject(e); };
  });
}
function saveImage(id, base64) {
  return new Promise(function(resolve, reject) {
    var tx = imgDb.transaction('images', 'readwrite');
    var store = tx.objectStore('images');
    if (base64) { store.put(base64, id); } else { store.delete(id); }
    tx.oncomplete = resolve;
    tx.onerror = reject;
  });
}
function getImage(id) {
  return new Promise(function(resolve) {
    var tx = imgDb.transaction('images', 'readonly');
    var req = tx.objectStore('images').get(id);
    req.onsuccess = function() { resolve(req.result || ''); };
    req.onerror = function() { resolve(''); };
  });
}
function getAllImages() {
  return new Promise(function(resolve) {
    var result = {};
    var tx = imgDb.transaction('images', 'readonly');
    var cursor = tx.objectStore('images').openCursor();
    cursor.onsuccess = function(e) { var c = e.target.result; if (c) { result[c.key] = c.value; c.continue(); } };
    tx.oncomplete = function() { resolve(result); };
  });
}
function clearImages() {
  return new Promise(function(resolve) {
    var tx = imgDb.transaction('images', 'readwrite');
    tx.objectStore('images').clear();
    tx.oncomplete = resolve;
  });
}// ==================== RENDER ====================
function render() {
  var search = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  var cat = document.getElementById('categoryFilter').value;
  var sup = document.getElementById('supplierFilter').value;
  var filtered = items.slice();
  if (search) filtered = filtered.filter(function(i) { return i.name.toLowerCase().indexOf(search) !== -1; });
  if (cat) filtered = filtered.filter(function(i) { return i.category === cat; });
  if (sup) filtered = filtered.filter(function(i) { return i.supplierId === sup; });

  var tbody = document.getElementById('tableBody');
  if (filtered.length === 0) { tbody.innerHTML = ''; }
  else {
    tbody.innerHTML = filtered.map(function(i) {
      var s = findSupplier(i.supplierId);
      var cls = i.qty <= LOW_STOCK ? ' class="low-stock"' : '';
      return '<tr' + cls + '>' +
        '<td><img class="thumb" id="thumb_' + i.id + '" src="" onerror="this.style.display=\'none\'"></td>' +
        '<td>' + esc(i.name) + '</td>' +
        '<td>' + esc(i.category || '-') + '</td>' +
        '<td>' + esc(s ? s.name : '-') + '</td>' +
        '<td>' + i.qty + '</td>' +
        '<td>' + (i.costPrice ? '¥' + fmt(i.costPrice) : '-') + '</td>' +
        '<td>' + (i.sellPrice ? '¥' + fmt(i.sellPrice) : '-') + '</td>' +
        '<td>' + esc(i.location || '-') + '</td>' +
        '<td class="actions-cell">' +
          '<button class="btn small" onclick="openStockModal(\'' + i.id + '\')">出入库</button>' +
          '<button class="btn small" onclick="openEditModal(\'' + i.id + '\')">编辑</button>' +
          '<button class="btn small danger" onclick="deleteItem(\'' + i.id + '\')">删除</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    // Load thumbnails async
    filtered.forEach(function(i) {
      var el = document.getElementById('thumb_' + i.id);
      if (!el) return;
      var cached = sessionStorage.getItem('thumb_' + i.id);
      if (cached) { el.src = cached; return; }
      getImage(i.id).then(function(b64) {
        if (b64) { el.src = b64; sessionStorage.setItem('thumb_' + i.id, b64); }
        else { el.style.display = 'none'; }
      });
    });
  }

  document.getElementById('emptyMsg').style.display = filtered.length === 0 ? '' : 'none';
  renderStats();
  populateFilters();
}

function renderStats() {
  var total = items.length;
  var totalQty = items.reduce(function(s,i) { return s + i.qty; }, 0);
  var totalCostVal = items.reduce(function(s,i) { return s + i.qty * (i.costPrice||0); }, 0);
  var lowCount = items.filter(function(i) { return i.qty <= LOW_STOCK && i.qty > 0; }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><div class="label">商品种类</div><div class="value">' + total + '</div></div>' +
    '<div class="stat-card"><div class="label">总库存量</div><div class="value">' + totalQty + '</div></div>' +
    '<div class="stat-card"><div class="label">库存总成本</div><div class="value">¥' + fmt(totalCostVal) + '</div></div>' +
    '<div class="stat-card warn"><div class="label">低库存预警 (≤' + LOW_STOCK + ')</div><div class="value">' + lowCount + '</div></div>';
}

function populateFilters() {
  var catSel = document.getElementById('categoryFilter');
  var catVal = catSel.value;
  catSel.innerHTML = '<option value="">全部分类</option>' + CATEGORIES.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  catSel.value = catVal;
  var supSel = document.getElementById('supplierFilter');
  var supVal = supSel.value;
  supSel.innerHTML = '<option value="">全部供应商</option>' + suppliers.map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join('');
  supSel.value = supVal;
}

function findSupplier(id) { if (!id) return null; for (var i=0;i<suppliers.length;i++) { if (suppliers[i].id===id) return suppliers[i]; } return null; }// ==================== ITEM CRUD ====================
function openAddModal() {
  document.getElementById('modalTitle').textContent = '添加商品';
  document.getElementById('editId').value = '';
  document.getElementById('itemName').value = '';
  document.getElementById('itemQty').value = '0';
  document.getElementById('itemCost').value = '0';
  document.getElementById('itemPrice').value = '0';
  document.getElementById('itemLocation').value = '';
  document.getElementById('itemNotes').value = '';
  document.getElementById('itemImgData').value = '';
  document.getElementById('itemImgPreview').style.display = 'none';
  document.getElementById('itemImgPlaceholder').style.display = '';
  populateCategorySelect('itemCategory');
  populateSupplierSelect('itemSupplier');
  document.getElementById('itemModal').classList.add('show');
  document.getElementById('itemName').focus();
}

function openEditModal(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  document.getElementById('modalTitle').textContent = '编辑商品';
  document.getElementById('editId').value = item.id;
  document.getElementById('itemName').value = item.name;
  document.getElementById('itemQty').value = item.qty;
  document.getElementById('itemCost').value = item.costPrice || '';
  document.getElementById('itemPrice').value = item.sellPrice || '';
  document.getElementById('itemLocation').value = item.location || '';
  document.getElementById('itemNotes').value = item.notes || '';
  populateCategorySelect('itemCategory', item.category);
  populateSupplierSelect('itemSupplier', item.supplierId);
  // Load image
  getImage(item.id).then(function(b64) {
    document.getElementById('itemImgData').value = b64 || '';
    if (b64) {
      document.getElementById('itemImgPreview').src = b64;
      document.getElementById('itemImgPreview').style.display = '';
      document.getElementById('itemImgPlaceholder').style.display = 'none';
    } else {
      document.getElementById('itemImgPreview').style.display = 'none';
      document.getElementById('itemImgPlaceholder').style.display = '';
    }
  });
  document.getElementById('itemModal').classList.add('show');
}

function saveItem() {
  var name = document.getElementById('itemName').value.trim();
  if (!name) { toast('请输入商品名称'); return; }
  var qty = parseInt(document.getElementById('itemQty').value) || 0;
  var costPrice = parseFloat(document.getElementById('itemCost').value) || 0;
  var sellPrice = parseFloat(document.getElementById('itemPrice').value) || 0;
  var category = document.getElementById('itemCategory').value;
  var supplierId = document.getElementById('itemSupplier').value;
  var location = document.getElementById('itemLocation').value.trim();
  var notes = document.getElementById('itemNotes').value.trim();
  var imgData = document.getElementById('itemImgData').value || '';
  var editId = document.getElementById('editId').value;
  var now = new Date().toISOString();

  if (editId) {
    var idx = items.findIndex(function(i) { return i.id === editId; });
    if (idx !== -1) {
      items[idx].name = name;
      items[idx].category = category;
      items[idx].supplierId = supplierId;
      items[idx].qty = qty;
      items[idx].costPrice = costPrice;
      items[idx].sellPrice = sellPrice;
      items[idx].location = location;
      items[idx].notes = notes;
      items[idx].updatedAt = now;
    }
  } else {
    editId = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    items.push({
      id: editId, name: name, category: category, supplierId: supplierId,
      qty: qty, costPrice: costPrice, sellPrice: sellPrice,
      location: location, notes: notes,
      createdAt: now, updatedAt: now
    });
  }

  saveItems();
  saveImage(editId, imgData).then(function() {
    sessionStorage.removeItem('thumb_' + editId);
    closeModal();
    render();
    toast(editId ? '商品已更新' : '商品已添加');
  });
}

function deleteItem(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  if (!confirm('确定删除「' + item.name + '」吗？此操作不可撤销。')) return;
  items = items.filter(function(i) { return i.id !== id; });
  saveItems();
  saveImage(id, '').then(function() {
    sessionStorage.removeItem('thumb_' + id);
    render();
    toast('已删除');
  });
}// ==================== STOCK OPERATIONS ====================
function openStockModal(id) {
  var item = items.find(function(i) { return i.id === id; });
  if (!item) return;
  stockTargetId = id;
  document.getElementById('stockItemName').textContent = item.name;
  document.getElementById('stockCurrent').textContent = item.qty;
  document.getElementById('stockQty').value = '1';
  document.getElementById('stockOutBtn').style.display = item.qty > 0 ? '' : 'none';
  document.getElementById('stockModal').classList.add('show');
  document.getElementById('stockQty').focus();
}

function doStockOp(type) {
  var qty = parseInt(document.getElementById('stockQty').value) || 0;
  if (qty <= 0) { toast('请输入有效数量'); return; }
  var item = items.find(function(i) { return i.id === stockTargetId; });
  if (!item) return;
  if (type === 'in') {
    item.qty += qty;
  } else {
    if (item.qty < qty) { toast('库存不足，当前剩余 ' + item.qty); return; }
    item.qty -= qty;
  }
  item.updatedAt = new Date().toISOString();
  saveItems();
  closeStockModal();
  render();
  toast(type === 'in' ? '已进货 ' + qty + ' 件' : '已出货 ' + qty + ' 件');
}

// ==================== SUPPLIER MANAGEMENT ====================
function openSupplierManager() {
  renderSupplierList();
  document.getElementById('supName').value = '';
  document.getElementById('supContact').value = '';
  document.getElementById('supPhone').value = '';
  document.getElementById('supplierModal').classList.add('show');
}

function addSupplier() {
  var name = document.getElementById('supName').value.trim();
  if (!name) { toast('请输入供应商名称'); return; }
  suppliers.push({
    id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    name: name,
    contact: document.getElementById('supContact').value.trim(),
    phone: document.getElementById('supPhone').value.trim()
  });
  saveSuppliers();
  document.getElementById('supName').value = '';
  document.getElementById('supContact').value = '';
  document.getElementById('supPhone').value = '';
  renderSupplierList();
  populateFilters();
  toast('供应商已添加');
}

function deleteSupplier(id) {
  if (!confirm('确定删除此供应商吗？')) return;
  suppliers = suppliers.filter(function(s) { return s.id !== id; });
  saveSuppliers();
  // Unlink from items
  items.forEach(function(i) { if (i.supplierId === id) i.supplierId = ''; });
  saveItems();
  renderSupplierList();
  render();
  populateFilters();
  toast('供应商已删除');
}

function renderSupplierList() {
  var el = document.getElementById('supplierList');
  if (suppliers.length === 0) {
    el.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:12px 0">暂无供应商</div>';
    return;
  }
  el.innerHTML = suppliers.map(function(s) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">' +
      '<div><strong>' + esc(s.name) + '</strong>' +
      (s.contact ? ' &nbsp; ' + esc(s.contact) : '') +
      (s.phone ? ' &nbsp; ' + esc(s.phone) : '') +
      '</div>' +
      '<button class="btn small danger" onclick="deleteSupplier(\'' + s.id + '\')">删除</button>' +
    '</div>';
  }).join('');
}// ==================== IMAGE HANDLING ====================
function previewItemImage() {
  var file = document.getElementById('itemImgFile').files[0];
  if (!file) return;
  // Compress: max 400px wide, JPEG quality 0.7
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxW = 400;
      var scale = Math.min(1, maxW / img.width);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var b64 = canvas.toDataURL('image/jpeg', 0.7);
      document.getElementById('itemImgData').value = b64;
      document.getElementById('itemImgPreview').src = b64;
      document.getElementById('itemImgPreview').style.display = '';
      document.getElementById('itemImgPlaceholder').style.display = 'none';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeItemImage() {
  document.getElementById('itemImgData').value = '';
  document.getElementById('itemImgFile').value = '';
  document.getElementById('itemImgPreview').style.display = 'none';
  document.getElementById('itemImgPlaceholder').style.display = '';
}

// ==================== IMPORT / EXPORT ====================
function exportData() {
  getAllImages().then(function(images) {
    var data = { items: items, suppliers: suppliers, images: images, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '家具库存_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('数据已导出（含图片）');
  });
}

function importData(event) {
  var file = event.target.files[0];
  if (!file) return;
  if (!confirm('导入会覆盖当前所有数据（含图片），确定继续吗？')) { event.target.value = ''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.items || !Array.isArray(data.items)) throw new Error('数据格式错误');
      items = data.items;
      suppliers = data.suppliers || [];
      saveItems();
      saveSuppliers();
      // Clear and repopulate images
      clearImages().then(function() {
        var imgs = data.images || {};
        var keys = Object.keys(imgs);
        var done = 0;
        if (keys.length === 0) { finishImport(); return; }
        keys.forEach(function(k) {
          saveImage(k, imgs[k]).then(function() { done++; if (done === keys.length) finishImport(); });
        });
      });
    } catch(err) {
      toast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}


// ==================== REMOTE SYNC ====================
function fetchRemoteData() {
  remoteUrl = localStorage.getItem(REMOTE_URL_KEY);
  if (remoteUrl) {
    doRemoteFetch(remoteUrl);
  } else {
    openUrlModal();
  }
}

function saveRemoteUrl() {
  var url = document.getElementById('urlInput').value.trim();
  if (!url) { toast('请输入 URL'); return; }
  remoteUrl = url;
  localStorage.setItem(REMOTE_URL_KEY, url);
  closeUrlModal();
  doRemoteFetch(url);
}

function doRemoteFetch(url) {
  toast('正在从云端加载...');
  var btn = document.getElementById('syncBtn');
  btn.textContent = '加载中...';
  btn.disabled = true;

  // Auto-convert GitHub blob URL to raw URL
  var actualUrl = url;
  var ghMatch = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);
  if (ghMatch) {
    actualUrl = 'https://raw.githubusercontent.com/' + ghMatch[1] + '/' + ghMatch[2] + '/' + ghMatch[3];
  }

  fetch(actualUrl, { cache: 'no-cache' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' - 请确认链接正确');
      return res.json();
    })
    .then(function(data) {
      if (!data.items || !Array.isArray(data.items)) throw new Error('数据格式错误');
      items = data.items;
      suppliers = data.suppliers || [];
      saveItems();
      saveSuppliers();
      sessionStorage.clear();
      return clearImages().then(function() {
        var imgs = data.images || {};
        var keys = Object.keys(imgs);
        if (keys.length === 0) return;
        return Promise.all(keys.map(function(k) { return saveImage(k, imgs[k]); }));
      });
    })
    .then(function() {
      render();
      toast('已加载 ' + items.length + ' 条记录');
    })
    .catch(function(err) {
      toast('加载失败: ' + err.message);
    })
    .finally(function() {
      btn.textContent = '云端刷新';
      btn.disabled = false;
    });
}

function changeRemoteUrl() { openUrlModal(); }
function openUrlModal() {
  document.getElementById('urlInput').value = remoteUrl || '';
  document.getElementById('urlModal').classList.add('show');
  document.getElementById('urlInput').focus();
}
function closeUrlModal() { document.getElementById('urlModal').classList.remove('show'); }
function finishImport() {
  sessionStorage.clear();
  render();
  toast('成功导入 ' + items.length + ' 条记录');
}

// ==================== HELPERS ====================
function populateCategorySelect(selectId, selected) {
  var sel = document.getElementById(selectId);
  if (!sel) return;
  sel.innerHTML = '<option value="">请选择</option>' +
    CATEGORIES.map(function(c) { return '<option value="' + c + '"' + (c === selected ? ' selected' : '') + '>' + c + '</option>'; }).join('');
}

function populateSupplierSelect(selectId, selected) {
  var sel = document.getElementById(selectId);
  if (!sel) return;
  sel.innerHTML = '<option value="">请选择</option>' +
    suppliers.map(function(s) { return '<option value="' + s.id + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('categoryFilter').value = '';
  document.getElementById('supplierFilter').value = '';
  render();
}

function closeModal() { document.getElementById('itemModal').classList.remove('show'); }
function closeStockModal() { document.getElementById('stockModal').classList.remove('show'); stockTargetId = null; }
function closeSupplierModal() { document.getElementById('supplierModal').classList.remove('show'); }

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmt(n) { return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

// Overlay click-outside
document.getElementById('itemModal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
document.getElementById('stockModal').addEventListener('click', function(e){ if (e.target === this) closeStockModal(); });
document.getElementById('urlModal').addEventListener('click', function(e){ if (e.target === this) closeUrlModal(); });
document.getElementById('supplierModal').addEventListener('click', function(e){ if (e.target === this) closeSupplierModal(); });

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); closeStockModal(); closeSupplierModal(); closeUrlModal(); }
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});


// Right-click on sync button to change URL
document.getElementById('syncBtn').addEventListener('contextmenu', function(e) { e.preventDefault(); changeRemoteUrl(); });
